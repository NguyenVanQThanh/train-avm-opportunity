[project]
name = "avm-train"
version = "0.0.1"
description = "Offline training pipeline for V-Nexus AVM (LightGBM point + quantile + CQR)"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "pyyaml>=6",
    "huggingface_hub>=0.25",
    "unidecode>=1.3",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2"]   # T1 only: read-only replica extract
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
avm-train = "avm_train.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
